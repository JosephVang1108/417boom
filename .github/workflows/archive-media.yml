# Rescues finished renders into permanent storage.
#
# Lip-sync renders come back as temporary links (Magica deletes them
# after 7 days). This workflow runs on GitHub's servers: it downloads
# the file and attaches it to the repo's "media" release, where the
# app streams it from — permanent, free, CDN-served.
#
# Run it from the Actions tab (or API) with the temporary URL and the
# final file name, e.g. sermon-come-back-home.mp4. The file is then
# served forever at:
#   https://github.com/<owner>/<repo>/releases/download/media/<name>
name: Archive media

on:
  workflow_dispatch:
    inputs:
      url:
        description: Temporary URL of the rendered video
        required: true
        type: string
      name:
        description: Final asset file name (e.g. sermon-come-back-home.mp4)
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download
        env:
          SRC_URL: ${{ inputs.url }}
          ASSET_NAME: ${{ inputs.name }}
        run: |
          curl -fL --retry 3 --retry-delay 5 -o "original-$ASSET_NAME" "$SRC_URL"
          ls -lh "original-$ASSET_NAME"
          sha256sum "original-$ASSET_NAME"

      # Renders arrive as near-lossless masters (hundreds of MB) — far
      # too heavy to stream to a phone. The asset under the plain name
      # is a phone-friendly encode; the master is kept alongside it for
      # future re-encodes and re-renders.
      - name: Make the streaming copy
        env:
          ASSET_NAME: ${{ inputs.name }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel warning -i "original-$ASSET_NAME" \
            -c:v libx264 -crf 23 -preset medium -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart \
            "$ASSET_NAME"
          ls -lh "$ASSET_NAME"

      - name: Attach to the media release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ inputs.name }}
        run: |
          gh release view media >/dev/null 2>&1 || \
            gh release create media --title "App media" \
              --notes "Recorded sermons and stories the app streams. Each file: https://github.com/${{ github.repository }}/releases/download/media/<name>"
          gh release upload media "$ASSET_NAME" "original-$ASSET_NAME" --clobber
