<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1420" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>SpeedLead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <strong>SpeedLead</strong>
          <small id="healthMeta">Starting…</small>
        </div>
      </div>
      <button type="button" class="icon-btn" id="refreshBtn" aria-label="Refresh">↻</button>
    </header>

    <div class="banner" id="modeBanner" hidden></div>

    <main class="main">
      <header class="view-head">
        <h1 id="viewTitle">Inbox</h1>
        <p id="viewSubtitle">Hire requests only — complaints stay quiet.</p>
      </header>

      <section class="view is-active" id="view-inbox" data-panel="inbox">
        <div class="filters">
          <label class="check">
            <input type="checkbox" id="alertsOnly" checked />
            Alerts only
          </label>
          <span id="inboxCount" class="muted"></span>
        </div>
        <div class="lead-list" id="leadList"></div>
      </section>

      <section class="view" id="view-intake" data-panel="intake">
        <div class="demo-row">
          <button type="button" class="chip" data-demo="hire">Try hire request</button>
          <button type="button" class="chip" data-demo="complaint">Try complaint</button>
        </div>
        <form class="capture-form" id="captureForm">
          <label>
            <span>Facebook group</span>
            <input name="group_name" placeholder="Springfield Moms" autocomplete="off" />
          </label>
          <label>
            <span>Post link (optional)</span>
            <input name="post_url" type="url" inputmode="url" placeholder="https://facebook.com/…" autocomplete="off" />
          </label>
          <label>
            <span>Post text</span>
            <textarea name="text" rows="6" required placeholder="Paste the Facebook post here…"></textarea>
          </label>
          <label class="check">
            <input type="checkbox" name="send_sms" id="sendSms" />
            Also text me if it’s a hire request
          </label>
          <p class="form-status" id="captureStatus" role="status"></p>
          <aside class="result-panel" id="resultPanel" hidden></aside>
          <div class="sticky-cta">
            <button class="btn btn-primary btn-block" type="submit">Classify post</button>
          </div>
        </form>
      </section>

      <section class="view" id="view-settings" data-panel="settings">
        <form class="settings-form" id="settingsForm">
          <label>
            <span>Business name</span>
            <input name="name" required autocomplete="organization" />
          </label>
          <label>
            <span>Your name</span>
            <input name="owner_name" required autocomplete="name" />
          </label>
          <label>
            <span>Business phone (in replies)</span>
            <input name="phone" type="tel" inputmode="tel" required autocomplete="tel" />
          </label>
          <label>
            <span>Alert SMS phone</span>
            <input name="alert_phone" type="tel" inputmode="tel" required autocomplete="tel" />
          </label>
          <label>
            <span>City</span>
            <input name="city" required autocomplete="address-level2" />
          </label>
          <label>
            <span>Trades</span>
            <input name="trades" placeholder="hvac,plumbing" />
          </label>
          <button class="btn btn-primary btn-block" type="submit">Save settings</button>
          <p class="form-status" id="settingsStatus" role="status"></p>
        </form>
        <div class="templates" id="templatesBox"></div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary">
      <button type="button" class="tab-btn is-active" data-view="inbox">
        <span class="tab-icon" aria-hidden="true">◈</span>
        <span>Inbox</span>
      </button>
      <button type="button" class="tab-btn tab-btn-primary" data-view="intake" id="gotoCaptureBtn">
        <span class="tab-icon tab-icon-plus" aria-hidden="true">＋</span>
        <span>Capture</span>
      </button>
      <button type="button" class="tab-btn" data-view="settings">
        <span class="tab-icon" aria-hidden="true">☰</span>
        <span>Settings</span>
      </button>
    </nav>
  </div>
  <script src="matcher.js"></script>
  <script src="app.js"></script>
</body>
</html>
